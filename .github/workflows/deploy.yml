name: Deploy React App to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "📍 Navigating to project directory on EC2..."
            cd ~/AWS-EC2-Testing

            echo "📥 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Ensuring .env file exists..."
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
              else
                touch .env
              fi
            fi

            echo "📦 Installing npm dependencies..."
            npm install

            echo "🏗️ Building React static application..."
            npm run build

            echo "🚀 Deploying dist folder to Nginx web root (/var/www/html)..."
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            echo "🔄 Reloading Nginx web server..."
            sudo systemctl reload nginx || sudo systemctl restart nginx || true

            echo "✅ Deployment completed successfully! Your changes are now live."